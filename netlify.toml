[build]
  command = "npm run web:build"
  publish = "web-dist"

[build.environment]
  NODE_VERSION = "24"

[[headers]]
  for = "/*"
  [headers.values]
    # Keep the opener connection to the trusted 3D viewer so a selected local
    # depth image can be transferred directly between the two tabs.
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Cross-Origin-Embedder-Policy = "require-corp"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; connect-src 'self' https: blob: data:; font-src 'self' data:; frame-ancestors 'none'; img-src 'self' blob: data:; object-src 'none'; script-src 'self' https://analytics.re4vive.com 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:"
