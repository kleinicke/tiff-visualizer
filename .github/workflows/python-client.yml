name: Python, REST and MCP
on:
  push:
  pull_request:
jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build:python-viewer
      - run: python -m pip install './packages/python[arrays,http]' build
      - run: python -m unittest discover -s packages/python/tests -v
      - run: npx playwright install --with-deps chromium
      - run: IMAGE_VIEWER_PYTHON="$(command -v python)" npx playwright test test/playwright/python-client.spec.ts
      - run: python -m build packages/python
