[package]
name = "tiff-wasm"
version = "0.1.0"
edition = "2021"
description = "WebAssembly bindings for scientific-image-decoders and TIFF Visualizer processing"
license = "MIT"
repository = "https://github.com/kleinicke/tiff-visualizer"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
scientific-image-decoders = { path = "../../crates/image-decoders", default-features = false, features = ["all-formats"] }
wasm-bindgen = "0.2"
console_error_panic_hook = { version = "0.1.6", optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"

# wasm-opt (binaryen) is an optional post-processing step. Disable it so the
# build does not depend on downloading the binaryen toolchain at build time;
# the workspace release profile already optimizes the generated code.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
