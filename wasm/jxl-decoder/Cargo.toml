[package]
name = "jxl-wasm"
version = "0.1.0"
edition = "2021"
description = "JPEG XL decoding for TIFF Visualizer, built as its own lazily-loaded WebAssembly module"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
# This lazy module owns jxl-rs and also builds the shared TIFF and DICOM
# parsers so an embedded codestream is decoded through the authoritative
# container implementation. It remains unfetched until JPEG XL is requested.
scientific-image-decoders = { path = "../../crates/image-decoders", default-features = false, features = ["jxl", "tiff", "dicom"] }
wasm-bindgen = "0.2"
console_error_panic_hook = { version = "0.1.6", optional = true }

# Disabled for the same reason as wasm/tiff-decoder: the build must not depend
# on downloading the binaryen toolchain, and the workspace release profile
# already optimizes the generated code.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
